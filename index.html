<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚌 EMT Valencia - Mapa Interactivo</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #1a4a8c;
            --secondary: #2c5aa0;
            --accent: #e53935;
            --light: #f5f5f5;
            --dark: #1b3a5c;
            --success: #43a047;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--primary); color: #fff; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 0; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        .subtitle { color: #b0b0b0; font-size: 1.2rem; }
        .mode-selector { margin: 30px 0; text-align: center; }
        .mode-btn { 
            background: var(--secondary); 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            font-size: 1.3rem; 
            margin: 0 10px; 
            cursor: pointer; 
            border-radius: 25px; 
            transition: transform 0.2s, box-shadow 0.2s;
            width: 45%;
        }
        .mode-btn:hover { background: var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .mode-btn.active { background: var(--accent); transform: scale(1.05); }
        .game-area { min-height: 600px; background: var(--dark); border-radius: 20px; padding: 30px; margin-top: 20px; display: none; }
        .game-area.active { display: block; }
        .study-area { min-height: 600px; background: var(--dark); border-radius: 20px; padding: 30px; margin-top: 20px; display: none; }
        .study-area.active { display: block; }
        .question-card { background: var(--secondary); padding: 25px; border-radius: 15px; margin: 20px 0; }
        .answer-btn { 
            width: 100%; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 1rem; 
            margin: 8px 0; 
            cursor: pointer; 
            border-radius: 10px; 
            text-align: left;
        }
        .answer-btn:hover { background: var(--accent); }
        .answer-btn.correct { background: var(--success) !important; }
        .answer-btn.incorrect { background: var(--accent) !important; }
        .score { font-size: 1.5rem; margin: 20px 0; }
        .flashcard { 
            background: var(--secondary); 
            padding: 40px; 
            border-radius: 15px; 
            text-align: center; 
            margin: 20px 0; 
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flashcard h3 { color: white; margin-bottom: 10px; }
        .nav { text-align: center; margin: 30px 0; }
        .nav a { color: var(--accent); text-decoration: none; margin: 0 15px; }
        @media (max-width: 768px) { .mode-btn { width: 100%; margin: 5px 0; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚌 EMT Valencia</h1>
            <div class="subtitle">Aplicación interactiva de callejero y test</div>
        </header>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="estudio">Modo Estudio</button>
            <button class="mode-btn" data-mode="juego">Modo Juego</button>
        </div>

        <div class="study-area active" id="studyArea">
            <div class="score">Puntuación: <span id="score">0</span>/10</div>
            <div class="question-card" id="questionCard">
                <h3>Selecciona un modo para comenzar</h3>
                <p>Modo Estudio: Lee y memoriza el callejero</p>
                <p>Modo Juego: Pon a prueba tus conocimientos</p>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="flashcard" id="flashcard">
                <h3 id="flashcardQuestion">Pregunta</h3>
            </div>
            <div class="nav">
                <a href="#" id="prevBtn">Anterior</a>
                <span id="questionNum">1 de 10</span>
                <a href="#" id="nextBtn">Siguiente</a>
            </div>
        </div>

        <footer style="text-align: center; margin-top: 40px; color: #b0b0b0;">
            EMT Valencia - Conductor Professional · Técnico Prosthetics
        </footer>
    </div>

    <script>
        const studyData = [
            { id: 1, question: "¿Qué líneas de EMT Valencia pasan por el barrio de el Pla?", answer: "Líneas principales: 1, 3, 5, 9, 15", hint: "Consultar PDF APUNTES EMT - Callejeros Valencia 2023" },
            { id: 2, question: "¿Cuál es la línea principal que conecta la estación de Norte con el Hospital?", answer: "Línea 7 (Norte-Hospital), cada 10-15 min", hint: "Ver PDF Conducción Eficiente EMT" },
            { id: 3, question: "¿Qué líneas tienen parada Violeta?", answer: "Líneas 5, 7, 12 y 18 tienen paradas Violetadas", hint: "PDF APTTUV - Paradas Violeta EMT Valencia" },
            { id: 4, question: "¿Cuál es el distrito donde se encuentra la Universidad Politécnica?", answer: "Campus Universitario - Distrito Universidad", hint: "PDF Callejero Valencia 2023" },
            { id: 5, question: "¿Qué línea pasa por la Plaza del Ayuntamiento?", answer: "Líneas 1, 3, 5, 7, 9, 11, 15, 19 - todas las centrales", hint: "Ver mapa 2023" },
            { id: 6, question: "¿Cuál es la frecuencia máxima de las líneas nocturnas?", answer: "N1, N2, N3 cada 30-40 min (horario reducido)", hint: "PDF Ordenanza EMT - Horarios nocturnos" },
            { id: 7, question: "¿Qué líneas tienen conexión con Metro en Valencia?", answer: "Líneas 1, 3, 5, 7 y 9 tienen estaciones de Metro próximas", hint: "Planificador EMT web" },
            { id: 8, question: "¿Cuál es el tiempo de viaje aprox. línea 10 desde Plaza del Ayuntamiento?", answer: "≈ 25 min hasta Patraix (8 paradas)", hint: "Consultar horarios oficiales EMT" },
            { id: 9, question: "¿Qué línea es la más larga de la red EMT Valencia?", answer: "Línea 5 (≈ 45 min recorrido completo)", hint: "PDF APTTUV - Rutas completas" },
            { id: 10, question: "¿Cuál es la última línea que opera en valencia nocturna?", answer: "N3 es la última, opera hasta ~06:00", hint: "PDF Ordenanza de Movilidad - Nocturna" }
        ];

        const gameData = [
            { q: "¿Qué líneas pasan por el barrio el Pla?", o: ["1", "2", "4", "8"], c: 0 },
            { q: "Frecuencia línea 7 (Norte-Hospital)", o: ["5-8 min", "10-15 min", "20-30 min", "35-40 min"], c: 1 },
            { q: "¿Qué línea tiene paradas Violetas?", o: ["1", "3", "5", "7"], c: 2 },
            { q: "Distrito Universidad", o: ["Ciutat Vella", "Patraix", "Universidad", "Maritim"], c: 2 },
            { q: "Plaza del Ayuntamiento", o: ["Línea 15", "Línea 7", "Varias líneas centrales", "Línea 3 solo"], c: 2 },
            { q: "Línea nocturna N1", o: ["06:00-22:00", "22:00-06:00", "Solo domingos", "Nocturna todo dia"], c: 1 },
            { q: "Conexión Metro línea 1", o: ["Estación James I", "Estación del Metropol", "Estación Colón", "No hay Metro"], c: 0 },
            { q: "Recorrido línea 5", o: ["Corto", "Mediano", "Larga", "Última"], c: 2 },
            { q: "Última nocturna", o: ["N1", "N2", "N3", "N4"], c: 2 },
            { q: "Frecuencia domingos", o: ["Igual que laborables", "Reducida", "No operan", "Solo festivos"], c: 1 }
        ];

        let currentMode = 'estudio';
        let currentIndex = 0;
        let score = 0;

        const modeBtns = document.querySelectorAll('.mode-btn');
        const studyArea = document.getElementById('studyArea');
        const gameArea = document.getElementById('gameArea');
        const flashcard = document.getElementById('flashcard');
        const questionCard = document.getElementById('questionCard');
        const scoreEl = document.getElementById('score');
        const questionNum = document.getElementById('questionNum');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const flashcardQuestion = document.getElementById('flashcardQuestion');

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                if (currentMode === 'estudio') {
                    studyArea.classList.add('active');
                    gameArea.classList.remove('active');
                } else {
                    gameArea.classList.add('active');
                    studyArea.classList.remove('active');
                    currentIndex = 0;
                    score = 0;
                    scoreEl.textContent = score;
                    showGameQuestion();
                }
            });
        });

        function showStudyQuestion() {
            const data = studyData[currentIndex];
            flashcard.innerHTML = `<h3>📚 Tema ${data.id}</h3><p>${data.question}</p><p><em>${data.hint}</em></p>`;
        }

        function showGameQuestion() {
            const data = gameData[currentIndex];
            const optionsHtml = data.o.map((opt, i) => `<button class="answer-btn" onclick="checkAnswer(${i})">${opt}</button>`).join('');
            flashcard.innerHTML = `<h3>❓ Pregunta ${currentIndex + 1}/10</h3><p>${data.q}</p>${optionsHtml}`;
        }

        function checkAnswer(selected) {
            const data = gameData[currentIndex];
            const btns = document.querySelectorAll('.answer-btn');
            
            btns.forEach((btn, i) => {
                if (i === data.c) {
                    btn.classList.add('correct');
                }
                if (i === selected && i !== data.c) {
                    btn.classList.add('incorrect');
                }
                btn.disabled = true;
            });
            
            if (selected === data.c) {
                score++;
                scoreEl.textContent = score;
            }
            
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < 10) {
                    showGameQuestion();
                } else {
                    setTimeout(() => {
                        alert(`🎉 ¡Terminaste! Puntuación: ${score}/10\n${score === 10 ? '¡Perfecto!' : 'Sigue practicando'}`);
                        currentIndex = 0;
                        score = 0;
                        scoreEl.textContent = score;
                        showGameQuestion();
                    }, 1000);
                }
            }, 1500);
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                showStudyQuestion();
                updateQuestionNum();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < studyData.length - 1) {
                currentIndex++;
                showStudyQuestion();
                updateQuestionNum();
            }
        });

        function updateQuestionNum() {
            questionNum.textContent = `${currentIndex + 1} de ${studyData.length}`;
        }

        showStudyQuestion();
        updateQuestionNum();
    </script>
</body>
</html>
